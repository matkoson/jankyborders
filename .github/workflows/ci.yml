name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, enabled]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build engine and CLI QA
        run: /usr/bin/swift local/qa-matkoson-jankyborders
